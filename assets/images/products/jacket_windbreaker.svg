<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#0C4A6E" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0C4A6E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" fill="url(#bgGrad)" />
  <rect width="600" height="450" fill="url(#grid)" />
  <circle cx="300" cy="200" r="180" fill="url(#glow)" />

  <!-- Tag Pill -->
  <g transform="translate(40, 40)">
    <rect width="110" height="28" rx="14" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="55" y="18" fill="#06B6D4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">OUTERWEAR</text>
  </g>

  <!-- Central Icon Frame -->
  <g transform="translate(150, 60)" fill="#06B6D4" stroke="#06B6D4">
    <polygon points="80,90 150,55 220,90 205,225 95,225" fill="none" stroke="currentColor" stroke-width="12"/><line x1="150" y1="55" x2="150" y2="225" stroke="currentColor" stroke-width="8"/>
  </g>

  <!-- Title & Subtitle Badge Footer -->
  <rect x="0" y="360" width="600" height="90" fill="rgba(0,0,0,0.4)" />
  <line x1="0" y1="360" x2="600" y2="360" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  
  <text x="40" y="398" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">Techwear Windbreaker</text>
  <text x="40" y="425" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Waterproof Ripstop • Premium Quality</text>
  
  <!-- Subtle Brand Watermark -->
  <text x="560" y="415" fill="rgba(255,255,255,0.3)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="end" letter-spacing="1">VOGUEORA APPAREL</text>
</svg>