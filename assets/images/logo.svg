<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#8B5CF6" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Icon Emblem -->
  <g transform="translate(5, 5)">
    <rect x="0" y="0" width="50" height="50" rx="14" fill="url(#logoGrad)" filter="url(#shadow)"/>
    <!-- Hanger & Diamond Fashion Symbol -->
    <path d="M 25 15 C 22 15 20 17 20 19 C 20 21 22 22 24 22 L 25 22 L 14 29 L 36 29 Z" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="25" cy="35" r="2.5" fill="#FFFFFF"/>
  </g>
  
  <!-- Text Brand -->
  <text x="68" y="32" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#0F172A" letter-spacing="1">
    VOGUE<tspan fill="#6366F1">ORA</tspan>
  </text>
  <text x="69" y="46" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#64748B" letter-spacing="2.5">
    APPAREL MANAGER
  </text>
</svg>
